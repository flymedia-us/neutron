name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOBBY_COMMIT: "5dfc8546954ce3b3198132ab13fddb89ee92cdd7"
  FONT_TOOLS: "afdko==4.0.3 fonttools==4.66.1"

jobs:
  build:
    name: full app build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sh scripts/select-xcode.sh

      - name: Record the toolchain
        run: |
          sh scripts/select-xcode.sh
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Install cross compilers
        run: brew install mingw-w64 bison flex

      - name: Clone Dobby at the pinned commit
        run: |
          git clone --no-checkout https://github.com/jmpews/Dobby.git vendor/dobby
          git -C vendor/dobby checkout "$DOBBY_COMMIT"

      - name: Restore Dobby build cache
        id: dobby-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dobby
          key: dobby-xcode-27-${{ env.DOBBY_COMMIT }}-${{ runner.arch }}

      - name: Build Dobby
        if: steps.dobby-cache.outputs.cache-hit != 'true'
        run: make dobby

      - name: Restore the Wine trees
        id: wine-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            scratch/wine
            scratch/wine-build-dual
            scratch/wine-build-arm64
          key: wine-xcode-27-${{ hashFiles('bridge/setup-wine-tree.sh', 'bridge/register-components.diff') }}

      - name: Restore Proton tarball cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: scratch/proton-lsc
          key: proton-tarball-${{ hashFiles('lsteamclient/fetch.sh') }}

      - name: Build the dylib
        run: make all

      - name: Build the overlay shim
        run: make overlay-shim

      - name: Build helpers
        run: make iconmaker appinfo

      - name: Build the bridge
        run: make bridge

      - name: Save the Wine trees
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            scratch/wine
            scratch/wine-build-dual
            scratch/wine-build-arm64
          key: wine-xcode-27-${{ hashFiles('bridge/setup-wine-tree.sh', 'bridge/register-components.diff') }}

      - name: Install font tools
        run: |
          brew install fontforge gpatch
          python3 -m venv scratch/fontvenv
          # shellcheck disable=SC2086 # FONT_TOOLS is a pinned list of requirements.
          scratch/fontvenv/bin/pip install $FONT_TOOLS
          echo "$PWD/scratch/fontvenv/bin" >> "$GITHUB_PATH"

      - name: Build the fonts
        run: make fonts

      - name: Stage the app payload
        run: make app-payload

      - name: Build the app
        run: make app APP_SIGN_ID=-

      - name: Check the minimum macOS version
        run: make -s mincheck

      - name: Check the translations
        run: make -s l10ncheck

      - name: Check drag-to-Applications DMG packaging
        run: bash scripts/package-dmg.sh out/Neutron.app out/Neutron-test.dmg

      - name: Run the hermetic C suites
        run: |
          make -s sigcheck
          make -s callscheck
          make -s webpatch-fixtures
          make -s peicon-fixtures
          make -s panel-behavior
          make -s spawn-env
          make -s activatecheck
          make -s compatcheck
          make -s compatsvc-check
          make -s prefixstate-check
          make -s shortcutcheck
          make -s launch-shell
          make -s envcheck
          make -s buildcheck
          make -s settingscheck
          make -s routecheck
          make -s bridgecheck
          make -s gamedrivecheck
          make -s launchercheck
          make -s seedcheck

      - name: Check overlay ownership and delivery
        run: make -s overlay-shim-tests

      - name: Check release metadata
        run: python3 scripts/test-release.py

      - name: Run the Swift tests
        run: make -s app-tests

      - name: Confirm dependency pins stayed locked
        run: python3 scripts/check-package-lock.py

      - name: Package the app bundle
        run: |
          mkdir -p out/artifact
          ditto -c -k --keepParent out/Neutron.app out/artifact/Neutron.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Neutron
          path: out/artifact
