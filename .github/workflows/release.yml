name: release
# Publishing is explicit. Syncing upstream never releases an unreviewed build.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/app.yml
  release:
    permissions:
      contents: write
    needs: build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Neutron
          path: release
      - name: Verify and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/^#define NOTPROTON_VERSION "\(.*\)"/\1/p' dylib/version.h)
          test -n "$version"
          ditto -x -k release/Neutron.zip release/extracted
          codesign --verify --strict release/extracted/Neutron.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' release/extracted/Neutron.app/Contents/Info.plist)
          test "$actual" = "$version"
          shasum -a 256 release/Neutron.zip > release/SHA256SUMS
          gh release create "v$version" release/Neutron.zip release/SHA256SUMS --target "$GITHUB_SHA" --title "Neutron $version" --generate-notes --prerelease
