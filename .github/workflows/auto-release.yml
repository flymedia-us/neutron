name: automatic release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neutron-auto-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'flymedia-us/neutron' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish an untagged version automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/auto-release.sh
