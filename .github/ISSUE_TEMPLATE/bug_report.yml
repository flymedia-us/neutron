name: Bug report
description: Something in Neutron does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Neutron version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Wine runtime
      options: [Highball, Other]
    validations:
      required: true
  - type: input
    id: runtime_version
    attributes:
      label: Runtime version / engine id
      placeholder: "Highball Wine 11 r19"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: neutron-run.log (from the game's prefix)
      description: Remove usernames, personal paths, account identifiers, and credentials before posting.
      render: text
